<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memuat Halaman...</title>
    <style>
        /* Gaya opsional agar tampilan saat loading terlihat rapi dan tidak kaku */
        body {
            margin: 0;
            padding: 0;
            background-color: #0f172a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .loader-container {
            text-align: center;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: color: #38bdf8;
            border-top-color: #38bdf8;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
    <script>
        // Logika pengecekan perangkat berdasarkan User Agent atau lebar layar
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth <= 768;

        // Proses pengalihan otomatis (redirect)
        if (isMobile) {
            window.location.replace("mobile.html");
        } else {
            window.location.replace("desktop.html");
        }
    </script>
</head>
<body>
    <div class="loader-container">
        <div class="spinner"></div>
        <p>Menyesuaikan dengan perangkatmu...</p>
    </div>
</body>
</html>
